openapi: 3.0.3
info:
  title: svc-core Schedules API
  description: >-
    Schedule domain API: schedule CRUD, reminders, bulk-delete, and Gemini
    text extraction. Documents only the endpoints that are actually
    implemented and reachable in this build. Error responses include a
    generated X-Request-ID header for log and event correlation.
  version: "1.0.0"
servers:
  - url: http://core.core.svc.cluster.local:8080
    description: in-cluster service DNS
  - url: http://localhost:8080
    description: local development

tags:
  - name: Health
    description: Liveness / readiness / metrics probes
  - name: Schedules
    description: Schedule CRUD, listing, and bulk-delete
  - name: Reminders
    description: Reminder sub-resource of a schedule

security:
  - BearerAuth: []

paths:
  /schedules.ics:
    get:
      tags: [Schedules]
      summary: Export a bounded date range as an ICS calendar
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: timezone
          in: query
          description: Display timezone for date-only overlap; schedule timezone remains unchanged.
          schema: { type: string, default: UTC }
      responses:
        "200":
          description: ICS calendar, with X-Event-Count and a 100-event maximum.
          headers:
            X-Event-Count:
              schema: { type: integer, minimum: 0, maximum: 100 }
          content:
            text/calendar:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: More than 100 schedules match; narrow the date range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: process is ready to receive traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: database or required outbox table is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready

  /status:
    get:
      tags: [Health]
      summary: Schedule and followup handoff availability
      description: >-
        The followup field describes the NATS handoff path only. Available does
        not mean Batch processing completed or a reminder was sent. A publisher
        disconnect or an outbox event unpublished for more than five seconds
        reports delayed. No personal data or backlog counts are returned.
      security: []
      responses:
        "200":
          description: schedule storage is available; followup may be delayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        "503":
          description: schedule storage or required database structure is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus exposition endpoint
      security: []
      responses:
        "200":
          description: metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [Health]
      summary: This OpenAPI document
      security: []
      responses:
        "200":
          description: the OpenAPI 3.0 spec, served as-is
          content:
            application/yaml:
              schema:
                type: string

  /schedules/extract:
    post:
      tags: [Schedules]
      summary: Extract schedule candidates from free-form text via Gemini
      description: >-
        Synchronously calls Gemini to turn free-form text into schedule
        candidates; nothing is persisted as a schedule (client must POST
        /schedules with source=ai to confirm one). now/timezone let the
        model convert relative expressions ("다음주 화요일") into absolute
        UTC timestamps. A supplied X-Gemini-Key is the exclusive key for this
        request; if it is invalid or rate-limited, Core reports that failure
        without retrying with the server key. Each call stores only audit
        metadata; raw input and extraction result are not retained.
      parameters:
        - name: X-Gemini-Key
          in: header
          required: false
          description: caller-supplied Gemini API key (BYOK); omit to use the server key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, now, timezone]
              properties:
                text:
                  type: string
                  maxLength: 10000
                  description: Non-blank Unicode text, at most 10000 code points and 64KiB UTF-8
                now:
                  type: string
                  format: date-time
                  description: caller's current time, RFC3339 UTC
                timezone:
                  type: string
                  description: IANA timezone name, e.g. Asia/Seoul
      responses:
        "200":
          description: >-
            Extracted candidates are not persisted. Candidates overlapping an
            existing same-title schedule include possible_duplicate in issues
            and require confirmation; extraction never changes saved schedules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/ExtractCandidate"
                  truncated:
                    type: boolean
                    description: true when Gemini returned more than 20 candidates; split the input and retry
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: text exceeds the 10000-character or 64KiB UTF-8 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Gemini upstream is rate limited even after one retry; Retry-After header is set
          headers:
            Retry-After:
              schema:
                type: integer
              description: seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Gemini call failed; error is ai_key_unavailable when no caller or server key exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Gemini upstream remains unavailable after one retry; error is ai_upstream_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules:
    post:
      tags: [Schedules]
      summary: Create a schedule
      description: >-
        Optional Idempotency-Key protects one create operation for 24 hours.
        Repeating the same key and content for the same user returns the original
        schedule with 201; changing the content returns 409. Omitting the header
        keeps legacy non-idempotent behavior.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated identifier, at most 128 characters
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: schedule created
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag containing the schedule revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Account deletion tombstone blocks writes for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency-Key conflict, reminder limit/duplicate, or unavailable consented channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/reminders/{scheduleID}/validity:
    get:
      tags: [Internal]
      summary: Validate a pending reminder against current schedule and account state
      description: Requires the shared internal service bearer token. Returns valid:false for missing, foreign, cancelled, or changed reminder timing/channel. A revision change alone is allowed when the computed reminder instant remains the same.
      security: []
      parameters:
        - name: scheduleID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: minutes_before
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 10080
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: remind_at
          in: query
          required: true
          description: Expected scheduled delivery instant in RFC3339. Core recomputes it from the live schedule and reminder offset.
          schema:
            type: string
            format: date-time
        - name: Authorization
          in: header
          required: true
          description: Bearer INTERNAL_SERVICE_TOKEN
          schema:
            type: string
      responses:
        "200":
          description: Current schedule snapshot and validity decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderValidity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Internal token or authoritative account/schedule lookup is unavailable

    get:
      tags: [Schedules]
      summary: List schedules in a time range
      description: >-
        Every request is bounded and keyset-paginated. from/to are required,
        from must precede to, and the range may not exceed 366 days. limit
        defaults to 20 and may be 1..100. q searches title/location as a
        literal substring. Timed schedules use interval overlap; all-day
        schedules use fixed local date ranges in the query timezone. Cursor is
        bound to user, timezone, and all filters. List rows omit reminders.
      parameters:
        - name: from
          in: query
          required: true
          description: inclusive lower bound, RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: exclusive upper bound, RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleStatus"
        - name: q
          in: query
          description: Literal substring search in title and location; blank is treated as no search.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size; defaults to 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Cursor returned by the previous page; filters must remain identical.
          schema:
            type: string
        - name: timezone
          in: query
          description: IANA display/calendar timezone used only for all-day date overlap and cursor binding; defaults to UTC.
          schema:
            type: string
            default: UTC
      responses:
        "200":
          description: matching schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Always present; null after the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/bulk-delete:
    post:
      tags: [Schedules]
      summary: Delete up to 100 schedules owned by the caller
      description: >-
        The operation is atomic. If any ID is missing or not owned by the
        caller, no schedule is deleted and a generic 404 is returned.
        Duplicate IDs are rejected. Optional Idempotency-Key preserves the
        first result for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Account deletion tombstone blocks writes for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Schedules]
      summary: Get one schedule, including its reminders
      responses:
        "200":
          description: the schedule
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag containing the schedule revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Schedules]
      summary: Partially update a schedule
      description: >-
        Only the fields present in the request body are changed; omitted
        fields keep their current value. A field set explicitly to null is
        rejected with 400 for every field except description and location,
        which are nullable. If-Match with the current strong ETag is required;
        a stale revision returns 412 and a missing precondition returns 428.
        Exact Idempotency-Key retries replay the original successful response.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by GET/POST/PATCH, e.g. "3".
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: the updated schedule
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag containing the schedule revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Account deletion tombstone blocks writes for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: The schedule revision changed since it was read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Local time is nonexistent or ambiguous without a fold choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: If-Match was omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Schedules]
      summary: Hard delete a schedule
      description: >-
        Deletes the schedule (and its reminders, via cascade) immediately.
        Optional Idempotency-Key makes retries return 204 for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Account deletion tombstone blocks writes for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      tags: [Schedules]
      summary: Clone a schedule into a new schedule
      description: >-
        Copies schedule fields and current reminder definitions to a new UUID.
        Status resets to confirmed, source to manual, revision to 1, and prior
        extraction/dispatch history is never copied. Optional Idempotency-Key
        makes a retry replay the same new schedule.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneScheduleRequest"
      responses:
        "201":
          description: new schedule created
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag containing the new schedule revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency conflict or no current verified and consented reminder channel.
        "410":
          description: Account deletion tombstone blocks writes for this account.
        "422":
          description: Local time is nonexistent or ambiguous without a fold choice.
        "503":
          description: Reminder channel validation is unavailable.

  /schedules/{id}/reminders:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Reminders]
      summary: List a schedule's reminders
      responses:
        "200":
          description: reminders, ordered by minutes_before ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Reminders]
      summary: Add a reminder to a schedule
      description: Optional Idempotency-Key preserves the created reminder for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: reminder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Account deletion tombstone blocks writes for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}/reminders/{reminderId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Reminders]
      summary: Remove a reminder
      description: Optional Idempotency-Key makes retries return 204 for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authorization: Bearer <access-token>. The token is a JWT (ES256)
        issued by the auth service and verified locally against its published
        JWKS, then checked for active account status by Auth. The authenticated
        user id always comes from the token's `sub` claim; it is never
        accepted from a request body or path parameter.

  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: missing, malformed, expired, or otherwise invalid bearer JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        the resource does not exist, or belongs to a different user
        (ownership never leaks as a distinct 403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency-Key was already used with different content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ServiceStatus:
      type: object
      required: [schedules, followup]
      properties:
        schedules:
          type: string
          enum: [available, unavailable]
        followup:
          type: string
          enum: [available, delayed]
    Error:
      type: object
      properties:
        error:
          type: string

    ScheduleStatus:
      type: string
      enum: [confirmed, tentative, cancelled]

    ScheduleSource:
      type: string
      enum: [manual, ai]

    ReminderChannel:
      type: string
      enum: [push, email, none, telegram]

    SupportedReminderChannel:
      type: string
      enum: [telegram]

    CreateReminderRequest:
      type: object
      required: [channel]
      properties:
        minutes_before:
          type: integer
          format: int32
          minimum: 0
          maximum: 10080
        channel:
          $ref: "#/components/schemas/SupportedReminderChannel"

    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        minutes_before:
          type: integer
          format: int32
        channel:
          $ref: "#/components/schemas/ReminderChannel"
        created_at:
          type: string
          format: date-time

    ReminderValidity:
      type: object
      required: [valid, schedule_id, user_id, title, revision, status, start_at, end_at, all_day, timezone, start_date, end_date]
      properties:
        valid:
          type: boolean
        schedule_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        revision:
          type: integer
          format: int64
        status:
          type: string
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        timezone:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true

    CloneScheduleRequest:
      type: object
      description: Optional fields override the source schedule; omitted values are copied.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          maxLength: 255
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        local_start_at:
          type: string
        local_end_at:
          type: string
        timezone:
          type: string
        start_fold:
          type: string
          enum: [earlier, later]
        end_fold:
          type: string
          enum: [earlier, later]
        all_day:
          type: boolean
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    CreateScheduleRequest:
      type: object
      required: [title]
      description: >-
        Provide either start_at (absolute RFC3339) or local_start_at with an
        IANA timezone. All-day requests use start_date/end_date (exclusive)
        and timezone instead. Fold choices are required for repeated local times.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          maxLength: 255
          nullable: true
        start_at:
          type: string
          format: date-time
          description: Absolute timestamp. Mutually exclusive with local_start_at.
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
          default: false
        timezone:
          type: string
          default: UTC
          description: IANA timezone. Existing UTC timestamps remain accepted.
        local_start_at:
          type: string
          description: Local wall time YYYY-MM-DDTHH:mm:ss; requires timezone.
        local_end_at:
          type: string
          description: Optional local wall time YYYY-MM-DDTHH:mm:ss; requires timezone.
        start_fold:
          type: string
          enum: [earlier, later]
        end_fold:
          type: string
          enum: [earlier, later]
        start_date:
          type: string
          format: date
          description: Required for date-only all-day input.
        end_date:
          type: string
          format: date
          description: Exclusive end date for all-day schedules.
        status:
          allOf:
            - $ref: "#/components/schemas/ScheduleStatus"
          default: confirmed
        source:
          allOf:
            - $ref: "#/components/schemas/ScheduleSource"
          default: manual
        extraction_id:
          type: string
          format: uuid
          description: links back to the ai_extractions row this schedule was confirmed from, if any
        reminders:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CreateReminderRequest"

    UpdateScheduleRequest:
      type: object
      description: every property is optional; only present ones are applied.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        timezone:
          type: string
        local_start_at:
          type: string
        local_end_at:
          type: string
        start_fold:
          type: string
          enum: [earlier, later]
        end_fold:
          type: string
          enum: [earlier, later]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ScheduleStatus"

    ExtractCandidate:
      type: object
      properties:
        title:
          type: string
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        location:
          type: string
          nullable: true
        description:
          type: string
        confidence:
          type: number
          description: model's 0-1 confidence estimate for this candidate
        needs_confirmation:
          type: boolean
          description: true if any required field is missing, invalid, ambiguous, or the candidate may duplicate a saved schedule
        issues:
          type: array
          items:
            type: string
          description: validation, ambiguity, or possible_duplicate issue codes

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        timezone:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        source:
          $ref: "#/components/schemas/ScheduleSource"
        extraction_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reminders:
