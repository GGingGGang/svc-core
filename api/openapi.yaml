openapi: 3.0.3
info:
  title: svc-core Schedules API
  description: >-
    Schedule domain API: schedule CRUD, reminders, bulk-delete, and Gemini
    text extraction. Documents only the endpoints that are actually
    implemented and reachable in this build. Error responses include a
    generated X-Request-ID header for log and event correlation.
  version: "1.0.0"
servers:
  - url: http://core.core.svc.cluster.local:8080
    description: in-cluster service DNS
  - url: http://localhost:8080
    description: local development

tags:
  - name: Health
    description: Liveness / readiness / metrics probes
  - name: Schedules
    description: Schedule CRUD, listing, and bulk-delete
  - name: Reminders
    description: Reminder sub-resource of a schedule

security:
  - BearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: process is ready to receive traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: database or required outbox table is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready

  /status:
    get:
      tags: [Health]
      summary: Schedule and followup handoff availability
      description: >-
        The followup field describes the NATS handoff path only. Available does
        not mean Batch processing completed or a reminder was sent. A publisher
        disconnect or an outbox event unpublished for more than five seconds
        reports delayed. No personal data or backlog counts are returned.
      security: []
      responses:
        "200":
          description: schedule storage is available; followup may be delayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        "503":
          description: schedule storage or required database structure is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus exposition endpoint
      security: []
      responses:
        "200":
          description: metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [Health]
      summary: This OpenAPI document
      security: []
      responses:
        "200":
          description: the OpenAPI 3.0 spec, served as-is
          content:
            application/yaml:
              schema:
                type: string

  /schedules/extract:
    post:
      tags: [Schedules]
      summary: Extract schedule candidates from free-form text via Gemini
      description: >-
        Synchronously calls Gemini to turn free-form text into schedule
        candidates; nothing is persisted as a schedule (client must POST
        /schedules with source=ai to confirm one). now/timezone let the
        model convert relative expressions ("다음주 화요일") into absolute
        UTC timestamps. An X-Gemini-Key header (BYOK) is used if present;
        otherwise the server's own Gemini key is used as a fallback. Every
        call — success or failure — is recorded as an ai_extractions audit
        row.
      parameters:
        - name: X-Gemini-Key
          in: header
          required: false
          description: caller-supplied Gemini API key (BYOK); omit to use the server's fallback key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, now, timezone]
              properties:
                text:
                  type: string
                  maxLength: 10000
                  description: Non-blank Unicode text, at most 10000 code points and 64KiB UTF-8
                now:
                  type: string
                  format: date-time
                  description: caller's current time, RFC3339 UTC
                timezone:
                  type: string
                  description: IANA timezone name, e.g. Asia/Seoul
      responses:
        "200":
          description: extracted candidates (not persisted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/ExtractCandidate"
                  truncated:
                    type: boolean
                    description: true when Gemini returned more than 20 candidates; split the input and retry
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: text exceeds the 10000-character or 64KiB UTF-8 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Gemini upstream is rate limited even after one retry; Retry-After header is set
          headers:
            Retry-After:
              schema:
                type: integer
              description: seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Gemini call failed; error is ai_key_unavailable when no caller or server key exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules:
    post:
      tags: [Schedules]
      summary: Create a schedule
      description: >-
        Optional Idempotency-Key protects one create operation for 24 hours.
        Repeating the same key and content for the same user returns the original
        schedule with 201; changing the content returns 409. Omitting the header
        keeps legacy non-idempotent behavior.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated identifier, at most 128 characters
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency-Key was already used with different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Schedules]
      summary: List schedules in a time range
      description: >-
        Returns schedules with start_at in [from, to). Omitting from/to
        defaults to the widest range the start_at column can hold. List rows
        do not include their reminders (fetch a single schedule for that).
      parameters:
        - name: from
          in: query
          description: inclusive lower bound, RFC3339 UTC
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: exclusive upper bound, RFC3339 UTC
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleStatus"
      responses:
        "200":
          description: matching schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/bulk-delete:
    post:
      tags: [Schedules]
      summary: Delete up to 100 schedules owned by the caller
      description: >-
        Ids that do not exist, or belong to a different user, are silently
        excluded from the delete rather than causing an error; the response
        reports how many rows were actually removed. Optional Idempotency-Key
        preserves the first result for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Schedules]
      summary: Get one schedule, including its reminders
      responses:
        "200":
          description: the schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Schedules]
      summary: Partially update a schedule
      description: >-
        Only the fields present in the request body are changed; omitted
        fields keep their current value. A field set explicitly to null is
        rejected with 400 for every field except description and location,
        which are nullable. Optional Idempotency-Key preserves the first
        result for 24 hours; reusing it with different content returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: the updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Schedules]
      summary: Hard delete a schedule
      description: >-
        Deletes the schedule (and its reminders, via cascade) immediately.
        Optional Idempotency-Key makes retries return 204 for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}/reminders:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [Reminders]
      summary: List a schedule's reminders
      responses:
        "200":
          description: reminders, ordered by minutes_before ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Reminders]
      summary: Add a reminder to a schedule
      description: Optional Idempotency-Key preserves the created reminder for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: reminder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /schedules/{id}/reminders/{reminderId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Reminders]
      summary: Remove a reminder
      description: Optional Idempotency-Key makes retries return 204 for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authorization: Bearer <access-token>. The token is a JWT (ES256)
        issued by the auth service and verified locally against its published
        JWKS, then checked for active account status by Auth. The authenticated
        user id always comes from the token's `sub` claim; it is never
        accepted from a request body or path parameter.

  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: missing, malformed, expired, or otherwise invalid bearer JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        the resource does not exist, or belongs to a different user
        (ownership never leaks as a distinct 403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency-Key was already used with different content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ServiceStatus:
      type: object
      required: [schedules, followup]
      properties:
        schedules:
          type: string
          enum: [available, unavailable]
        followup:
          type: string
          enum: [available, delayed]
    Error:
      type: object
      properties:
        error:
          type: string

    ScheduleStatus:
      type: string
      enum: [confirmed, tentative, cancelled]

    ScheduleSource:
      type: string
      enum: [manual, ai]

    ReminderChannel:
      type: string
      enum: [push, email, none]

    CreateReminderRequest:
      type: object
      required: [channel]
      properties:
        minutes_before:
          type: integer
          format: int32
          minimum: 0
        channel:
          $ref: "#/components/schemas/ReminderChannel"

    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        minutes_before:
          type: integer
          format: int32
        channel:
          $ref: "#/components/schemas/ReminderChannel"
        created_at:
          type: string
          format: date-time

    CreateScheduleRequest:
      type: object
      required: [title, start_at]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          maxLength: 255
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
          default: false
        status:
          allOf:
            - $ref: "#/components/schemas/ScheduleStatus"
          default: confirmed
        source:
          allOf:
            - $ref: "#/components/schemas/ScheduleSource"
          default: manual
        extraction_id:
          type: string
          format: uuid
          description: links back to the ai_extractions row this schedule was confirmed from, if any
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/CreateReminderRequest"

    UpdateScheduleRequest:
      type: object
      description: every property is optional; only present ones are applied.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        status:
          $ref: "#/components/schemas/ScheduleStatus"

    ExtractCandidate:
      type: object
      properties:
        title:
          type: string
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        location:
          type: string
          nullable: true
        description:
          type: string
        confidence:
          type: number
          description: model's 0-1 confidence estimate for this candidate
        needs_confirmation:
          type: boolean
          description: true if any required field is missing, invalid, or ambiguous
        issues:
          type: array
          items:
            type: string
          description: validation or ambiguity issue codes; empty for a valid candidate

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        all_day:
          type: boolean
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        source:
          $ref: "#/components/schemas/ScheduleSource"
        extraction_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reminders:
          type: array
          description: present on a single-schedule GET; omitted on list rows.
          items:
            $ref: "#/components/schemas/Reminder"
