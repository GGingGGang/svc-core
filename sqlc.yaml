version: "2"
sql:
  - engine: "mysql"
    queries: "db/queries/schedules.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "repo"
        out: "internal/repo"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
